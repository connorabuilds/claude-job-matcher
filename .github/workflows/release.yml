name: release
# When a release is published on GitHub, build job-matcher.plugin from the
# plugin folder and attach it to that release, so the download always
# matches the tagged code.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the plugin file to"
        required: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: python -m unittest discover tests
      - name: Build job-matcher.plugin
        run: |
          cd plugins/job-matcher
          zip -r ../../job-matcher.plugin . -x "*.DS_Store" -x "*__pycache__*"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" job-matcher.plugin --clobber
